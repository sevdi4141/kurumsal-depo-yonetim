version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: depo-mysql
    environment:
      MYSQL_DATABASE: depo_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./jar
    container_name: depo-backend
    ports:
      - "8082:8082"
    depends_on:
      - mysql-db
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/depo_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

  frontend:
    build: ./frontend
    container_name: depo-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mysql_data: